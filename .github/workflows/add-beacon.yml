name: add-beacon
permissions:
  contents: write

on:
  pull_request:
    paths: ["**.html"]

jobs:
  beacon:
    # Same-repo PRs only: a fork's branch cannot be pushed to.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add Cloudflare Web Analytics beacon to new pages
        run: python3 _dev/add_beacon.py
      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Add Cloudflare Web Analytics beacon to new pages"
            git push
          fi
